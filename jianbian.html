<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>渐变播放器图标</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
           background-image: linear-gradient(180deg,#3d7ea5,#4e4e4e);
        }
        .player-box {
            width: 380px;
            height: 380px;
            background-image: linear-gradient(90deg,#79bee9,#9a6868); 
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner-box {
            width: 220px;
            height: 220px;
            border: 25px solid #1a1a1a;
            background-image: linear-gradient(90deg,#532b84,#5762e1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn {
            width: 90px;
            height: 90px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arrow {
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 32px solid #222;
        }
    </style>
</head>
<body>
    <div class="player-box">
        <div class="inner-box">
            <div class="play-btn">
                <div class="arrow"></div>
            </div>
        </div>
    </div>
</body>
</html>
