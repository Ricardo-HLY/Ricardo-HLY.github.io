<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球日焦点轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .banner-container {
            width: 100%;
            max-width: 1200px;
            height: 300px; 
            margin: 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background-color: #87e0fd;
        }
        .arrow {
            width: 60px;
            height: 60px;
            margin: 0 10px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100%;
            cursor: pointer;
            z-index: 10;
            border: none;
            background-color: transparent;
        }
        .arrow-left {
            background-image: url("image/left.png");
        }
        .arrow-right {
            background-image: url("image/right.png");
        }
        .banner-img {
            flex: 1;
            height: 100%;
        }
        .banner-img img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        .dot-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px; 
            z-index: 10;
        }
        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100%;
        }
        .dot-normal {
            background-image: url("image/dot-normal.png");
        }
        .dot-active {
            background-image: url("image/dot-active.png");
        }
        .arrow:hover, .dot:hover {
            opacity: 0.8;
            transform: scale(1.05);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <button class="arrow arrow-left"></button>
        <div class="banner-img">
            <img src="image/banner.jpg" alt="地球日主题海报">
        </div>
        <button class="arrow arrow-right"></button>
        <div class="dot-wrapper">
            <div class="dot dot-normal"></div>
            <div class="dot dot-active"></div>
            <div class="dot dot-normal"></div>
            <div class="dot dot-normal"></div>
        </div>
    </div>
</body>
</html>
