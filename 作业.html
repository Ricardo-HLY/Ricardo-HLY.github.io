<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>如何培养认真严谨的习惯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
           
            font-family: "Microsoft Yahei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 1600px;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .image-box {
            flex-shrink: 0;
            width: 450px;
        }
        .image-box img {
            width: 100%;
            display: block;
        }
        .content-box {
            flex: 1;
        }
        .title {
            text-align: center;
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .title span {
            color: #4488dd;
        }
        .meta-info {
            text-align: center;
            font-size: 24px;
            color: #4488dd;
            margin-bottom: 30px;
        }
        .tips-list {
            list-style: none;
            font-size: 26px;
            line-height: 2.2;
        }
        .tips-list li {
            padding-left: 40px;
            position: relative;
        }
        .tips-list li::before {
            content: "♠";
            position: absolute;
            left: 0;
            color: #000;
        }
        .tips-list li .highlight {
            color: #ff3333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-box">
            <img src="attitude.jpg" alt="态度决定一切 细节决定成败">
        </div>
        <div class="content-box">
            <h1 class="title">如何培养<span>认真严谨</span>的习惯</h1>
            <div class="meta-info">时间:2022年02月21日17时26分 &nbsp;&nbsp;来源:思政教育</div>
            <ul class="tips-list">
                <li><span class="highlight">反复确认，</span>做任何事情都要照顾到每一个细节并反复确认，<span class="highlight">要有一种能在脑子里“虚拟”整个事件过程的能力，</span>确保所有的节点都正常。</li>
                <li><span class="highlight">想尽办法努力让不可能变为可能</span>只有佣金全力做了，才算是努力</li>
                <li><span class="highlight">结果导向—一切以结果为导向，任何事情都是你的名片。</span>还要思考你的结果和过程是否满足所有和你配合的人的需求,</li>
                <li><span class="highlight">学会假设了解周围比你强的人，观察他们的做事方法。</span>遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做</li>
            </ul>
        </div>
    </div>
</body>
</html>
